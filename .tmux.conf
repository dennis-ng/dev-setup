# Low escape-time so Ctrl+Arrow etc. aren't misread as Escape + keys
set -sg escape-time 10

# Enable focus events so Neovim gets FocusLost/FocusGained
set -g focus-events on

# Enable true color support
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*:RGB"

# Start window and pane numbering from 1; 0 selects last
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Mouse
set -g mouse on

# Allow OSC escape sequences to pass through to the terminal (enables hyperlinks in WezTerm)
set -g allow-passthrough on

# URL picker: prefix+u extracts URLs from pane and opens selected one
bind u run-shell -b "tmux capture-pane -J -p | grep -oE 'https?://[^ \"}>)]+' | sort -u | fzf-tmux -p --no-sort --prompt='Open URL: ' | xargs -r open"


# Kanagawa Wave pane styling - only bg differs to preserve text colors
set -g window-active-style 'fg=default,bg=#1F1F28'
set -g window-style 'fg=default,bg=#363646'

# Pane borders - Kanagawa colors
set -g pane-border-style 'fg=#54546D'
set -g pane-active-border-style 'fg=#7E9CD8'

# Pass through extended keys (CSI u sequences) so apps like Claude Code get Shift+Enter
set -g extended-keys on
set -g extended-keys-format csi-u
set -as terminal-features 'xterm*:extkeys'

set-option -g history-limit 5000

# Change prefix to Option+a
unbind C-b
set -g prefix M-a
bind M-a send-prefix

# Pane splitting (mirrors wezterm CMD+d / CMD+Shift+d)
bind d split-window -h -c '#{pane_current_path}'
bind D split-window -v -c '#{pane_current_path}'

# Close pane without confirm (mirrors wezterm CMD+w)
bind w kill-pane

# Pane focus switching (mirrors wezterm CMD+[ / CMD+])
bind [ select-pane -t :.-
bind ] select-pane -t :.+

# Rotate panes (mirrors wezterm CMD+Shift+[ / CMD+Shift+])
bind '{' rotate-window -U
bind '}' rotate-window -D

# Tab/window switching (mirrors wezterm Ctrl+CMD+[ / Ctrl+CMD+])
bind C-[ previous-window
bind C-] next-window

# Move tab left/right (mirrors wezterm CMD+Shift+Left / CMD+Shift+Right)
bind S-Left swap-window -t -1\; select-window -t -1
bind S-Right swap-window -t +1\; select-window -t +1

# Switch to tab by number (mirrors wezterm CMD+1-9, CMD+0)
bind 1 select-window -t :1
bind 2 select-window -t :2
bind 3 select-window -t :3
bind 4 select-window -t :4
bind 5 select-window -t :5
bind 6 select-window -t :6
bind 7 select-window -t :7
bind 8 select-window -t :8
bind 9 select-window -t :9
bind 0 select-window -t :$

# New tab/window (mirrors wezterm CMD+t)
bind t new-window -c '#{pane_current_path}'

# Fuzzy window switcher (prefix + prefix)
bind M-a run-shell -b "tmux list-windows -F '##I:##W  ##{pane_current_command}  ##{pane_current_path}' | fzf-tmux -p --prompt='Switch to: ' | cut -d: -f1 | xargs -r tmux select-window -t"

# Rename tab (mirrors wezterm CMD+Shift+r)
bind R command-prompt -I '#W' 'rename-window "%%"'

# Monitor bells so tab lights up on activity
set -g visual-bell off
set -g monitor-bell on
set -g bell-action other

# Status bar at bottom, matching wezterm Kanagawa tab style
set -g status-position bottom
set -g status-style 'bg=#2A2A37,fg=#C8C093'
set -g status-left ''
set -g status-right ''

# Window/tab list centered
set -g status-justify left

# Inactive tab style (matches wezterm inactive_tab)
# Bell flag overrides with teal highlight
set -g window-status-format '#{?window_bell_flag,#[bg=#00FFFF#,fg=#1F1F28#,bold],#[bg=#2A2A37#,fg=#C8C093]} #I:#W '
set -g window-status-style 'bg=#2A2A37,fg=#C8C093'

# Active tab style (matches wezterm active_tab)
set -g window-status-current-format '#[bg=#DCD7BA,fg=#1F1F28,bold] #I:#W '
set -g window-status-current-style 'bg=#DCD7BA,fg=#1F1F28,bold'

# Bell tab style - teal highlight
set -g window-status-bell-style 'bg=#00FFFF,fg=#1F1F28,bold'

# Remove extra separators
set -g window-status-separator ''

# tmux plugins
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
